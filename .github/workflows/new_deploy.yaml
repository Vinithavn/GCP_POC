name: Deploy Backend Job and Streamlit Frontend to GCP

on:
  push:
    branches:
      - main  # Triggers the pipeline when pushing code to the main branch

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1 # Update to your target GCP region
  GAR_REPO: my-docker-repo # Name of your Artifact Registry repository
  
  # Backend Config (Cloud Run Job)
  BACKEND_JOB_NAME: my-backend-job
  BACKEND_DOCKERFILE: ./backend/Dockerfile
  
  # Frontend Config (Cloud Run Service)
  FRONTEND_SERVICE_NAME: streamlit-frontend
  FRONTEND_DOCKERFILE: ./frontend/Dockerfile

jobs:
  deploy:
    name: Build and Deploy Applications
    runs-on: ubuntu-latest
    
    # Required permissions for Workload Identity Federation OIDC token generation
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    # 1. Checkout repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Authenticate to Google Cloud using OIDC
    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

    # 3. Log in to Google Artifact Registry
    - name: Log in to Artifact Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGION }}-docker.pkg.dev
        username: _json_key
        password: ${{ steps.auth.outputs.private_key || secrets.GCP_SA_KEY_FALLBACK }} # Fallback logic if using old keys; uses access token from auth step if OIDC is fully set up.
      # Alternative native approach:
      # run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

    # ==========================================
    # BACKEND DEPLOYMENT (Cloud Run Job)
    # ==========================================
    - name: Build and Push Backend Image
      run: |
        TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.BACKEND_JOB_NAME }}:${{ github.sha }}"
        docker build -t $TAG -f ${{ env.BACKEND_DOCKERFILE }} ./backend
        docker push $TAG
        echo "BACKEND_IMAGE=$TAG" >> $GITHUB_ENV

    - name: Deploy Cloud Run Job
      run: |
        # Check if the job already exists to decide whether to update or create
        if gcloud run jobs describe ${{ env.BACKEND_JOB_NAME }} --region ${{ env.REGION }} &>/dev/null; then
          gcloud run jobs update ${{ env.BACKEND_JOB_NAME }} \
            --image ${{ env.BACKEND_IMAGE }} \
            --region ${{ env.REGION }}
        else
          gcloud run jobs create ${{ env.BACKEND_JOB_NAME }} \
            --image ${{ env.BACKEND_IMAGE }} \
            --region ${{ env.REGION }}
        fi

    # ==========================================
    # FRONTEND DEPLOYMENT (Cloud Run Service)
    # ==========================================
    - name: Build and Push Frontend Image
      run: |
        TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.FRONTEND_SERVICE_NAME }}:${{ github.sha }}"
        docker build -t $TAG -f ${{ env.FRONTEND_DOCKERFILE }} ./frontend
        docker push $TAG
        echo "FRONTEND_IMAGE=$TAG" >> $GITHUB_ENV

    - name: Deploy Streamlit App to Cloud Run Service
      id: deploy-frontend
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: ${{ env.FRONTEND_SERVICE_NAME }}
        region: ${{ env.REGION }}
        image: ${{ env.FRONTEND_IMAGE }}
        # Exposes the Streamlit service to the public web
        flags: '--allow-unauthenticated' 
        # Optional: Inject environment variables into your Streamlit container if needed
        env_vars: |
          GCP_PROJECT_ID=${{ env.PROJECT_ID }}
          TARGET_BACKEND_JOB=${{ env.BACKEND_JOB_NAME }}

    # 4. Output the deployed application URL
    - name: Show Streamlit URL
      run: echo "Streamlit frontend successfully deployed to ${{ steps.deploy-frontend.outputs.url }}"
